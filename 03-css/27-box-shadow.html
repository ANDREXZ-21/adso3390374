<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>00-Template</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            div.box {
                border: 2px solid white;
                height: 160px;
                margin: 2rem auto;
                width: 280px;
                &.box1 { box-shadow: 0 0 12px;}
                &.box2 { box-shadow: -10px -10px 24px 0;}
                &.box3 { box-shadow: 0 0 20px #fff inset;}
                &.box4 { 
                    box-shadow: 0 0 12px 6px #FCD116,
                                12px 12px 12px 6px #003893,
                                24px 24px 12px 6px #CE1126;
                }
                                
            }

            div.images {
                text-align: center;
                img {
                    width: 150px;
                    &:first-child {
                        box-shadow: 0 0 18px whitesmoke;
                    }
                    &:last-child {
                        filter:drop-shadow(0 0 6px white)
                    }
                }
            }
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>27-box-shadow</h1>
            <h4>Property attaches one or more shadows to an element.</h4>
        </header>

        <section>
            <h4>box-shadow: 0 0 12px #fff</h4>
            <div class="box box1"></div>
            <h4>box-shadow: -10px -10px 24px 0 #fff</h4>
            <div class="box box2"></div>
            <h4>box-shadow: 0 0 20px #fff inset</h4>
            <div class="box box3"></div>
            <h4>box-shadow: multiple</h4>
            <div class="box box4"></div>
            <h4>box-shadow VS drop-shadow()</h4>
            <div class="images">
                <img src="imgs/cebollin">
                <img src="imgs/cebollin">
            </div>
        </section>

    </main>
</body>
</html>
