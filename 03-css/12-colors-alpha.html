<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>00-Template</title>
    <link rel="stylesheet" href="../src/css/master.css">
</head>
<style>
        div.mario{
            background: url(imgs/cebollin) no-repeat center;
            background-size: 150px auto; 
            height: 440px;
            width: 320px;
            div{
                height: calc(440px/3);
                border-bottom: 2px solid #0009;
                &:last-of-type {
                    border-bottom: none;
                }
                &.box1 {background-color: #fffc;}
                &.box2 {background-color: rgba(255,255,255,0.533);}
                &.box3 {background-color: hsla(0, 0%, 100%, 0.267);}
            }
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>12-Colors Alpha</h1>
            <h4>The fourth alpha channel allows you to apply opacity or transparency to the color.
</h4>
        </header>
        <section>
            <div class="mario">
                <div class="box1"></div>
                <div class="box2"></div>
                <div class="box3"></div>
            </div>
        </section>

    </main>
</body>
</html>
