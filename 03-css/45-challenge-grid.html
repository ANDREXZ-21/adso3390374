<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-challenge-grid</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        body {
            background-color: #1046a9;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(6, 160px);
            grid-template-areas: 
                "box1  box2  box2  box3"
                "box4  box2  box2  box5"
                "box6  box6  box6  box7"
                "box8  box8  box9  box10"
                "box8  box8  box11 box11"
                "box12 box13 box11 box11";
            gap: 10px;
            background-color: rgba(16, 70, 169);
            padding: 10px;
            border-radius: 14px;
            max-width: 600px;
            margin: auto;
        }

        .container div {
            border-radius: 10px;
            background-color: hsl(241, 78%, 40%);
            overflow: hidden;
        }

        .container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .box-1  { grid-area: box1; }
        .box-2  { grid-area: box2; }
        .box-3  { grid-area: box3; }
        .box-4  { grid-area: box4; }
        .box-5  { grid-area: box5; }
        .box-6  { grid-area: box6; }
        .box-7  { grid-area: box7; }
        .box-8  { grid-area: box8; }
        .box-9  { grid-area: box9; }
        .box-10 { grid-area: box10; }
        .box-11 { grid-area: box11; }
        .box-12 { grid-area: box12; }
        .box-13 { grid-area: box13; }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#ffffff" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>45-challenge-grid</h1>
            <h4>Grid Areas: Irregular Gallery</h4>
        </header>

        <section>
            <div class="container">
                <div class="box-1"><img src="imgs/nagi2.jpg" alt="nagi"></div>
                <div class="box-2"><img src="imgs/bachira.jpg" alt="bachira"></div>
                <div class="box-3"><img src="imgs/chiguiri.jpg" alt="chiguiri"></div>
                <div class="box-4"><img src="imgs/aiku.jpg" alt="aiku"></div>
                <div class="box-5"><img src="imgs/itoshi.jpg" alt="itoshi"></div>
                <div class="box-6"><img src="imgs/logob.jpg" alt="sae itoshi"></div>
                <div class="box-7"><img src="imgs/karasu.jpg" alt="karasu"></div>
                <div class="box-8"><img src="imgs/hiori.jpg" alt="hiori"></div>
                <div class="box-9"><img src="imgs/kunigami.jpg" alt="kunigami"></div>
                <div class="box-10"><img src="imgs/reo.jpg" alt="reo"></div>
                <div class="box-11"><img src="imgs/yukimiya.jpg" alt="yukimiya"></div>
                <div class="box-12"><img src="imgs/ryusei.jpg" alt="ryusei"></div>
                <div class="box-13"><img src="imgs/logo2.jpg" alt="logo"></div>
            </div>
        </section>
    </main>
</body>
</html>
