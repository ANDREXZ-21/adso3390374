<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-challenge-grid</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        body {
            background-color: #1046a9;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(6, 160px);
            gap: 10px;
            background-color: rgba(16, 70, 169);
            padding: 10px;
            border-radius: 14px;
            max-width: 600px;
            margin: auto;
        }

        .container div {
            border-radius: 10px;
            background-color: hsl(241, 78%, 40%);
            overflow: hidden;
        }

        .container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .box-2  { grid-column: 2 / 4; grid-row: 1 / 3; }
        .box-6  { grid-column: 1 / 4; }
        .box-8  { grid-column: 1 / 3; grid-row: 4 / 6; }
        .box-11 { grid-column: 3 / 5; grid-row: 5 / 7; }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#ffffff" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>45-challenge-grid</h1>
            <h4>Grid Areas: Irregular Gallery</h4>
        </header>

        <section>
            <div class="container">
                <div><img src="imgs/nagi2.jpg" alt="nagi"></div>
                <div class="box-2"><img src="imgs/bachira.jpg" alt="bachira"></div>
                <div><img src="imgs/chiguiri.jpg" alt="chiguiri"></div>
                <div><img src="imgs/aiku.jpg" alt="aiku"></div>
                <div><img src="imgs/itoshi.jpg" alt="itoshi"></div>
                <div class="box-6"><img src="imgs/logob.jpg" alt="sae itoshi"></div>
                <div><img src="imgs/karasu.jpg" alt="karasu"></div>
                <div class="box-8"><img src="imgs/hiori.jpg" alt="hiori"></div>
                <div><img src="imgs/kunigami.jpg" alt="kunigami"></div>
                <div><img src="imgs/reo.jpg" alt="reo"></div>
                <div class="box-11"><img src="imgs/yukimiya.jpg" alt="yukimiya"></div>
                <div><img src="imgs/ryusei.jpg" alt="ryusei"></div>
                <div><img src="imgs/logo2.jpg" alt="logo"></div>
            </div>
        </section>
    </main>
</body>
</html>
