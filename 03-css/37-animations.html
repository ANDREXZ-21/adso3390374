<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>37-animations</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
    img {
    width: 150px;
    height:auto;
    display: block;
    margin: 2rem auto;
    }

    section {
        div.jungle {
            background: url(imgs/fondo.jpg)
                        no-repeat center /cover;
            margin: 0 auto;
            position: relative;
            width: 320px;
            height: 460px;

            img.logos {
                position: absolute;
                transform: scale(.5);
                animation: 1s scream ease-in infinite;
                top: 20px;
                display: block;
                margin: 4rem;
                margin-top: -20px;
                
            }

            img.scream {
                position: absolute;
                left: 90px;
                top: 140px;
                width: 140px ;
                animation: 1s anisc ;
                
            }

            div.move {
        position: absolute;
        top: 350px;
        left: 0;
        width: 100%;
    }

        img.freddy {
        width: 170px;
        margin: 0;
        position: relative;
        animation: 3s caminar infinite alternate;
    }
        }
    }

    @keyframes scream{
        from {
            transform: scale(0.7);

        }
        50% {
            transform: scale(1);
        }
    }

    @keyframes anisc {
        0% { transform: translateY(-80px) rotateX(0deg) ; }
        40% { transform: translateY(-80px) rotateX(0deg) ; }
        50% { transform: translateY(-80px) rotateX(180deg) ; }
        60% { transform: translateY(-80px) rotateX(0deg) ; }
        100% { transform: translateY(0px) rotateX(0deg) ; }
    }

    @keyframes caminar {
    from {
        transform: translateX(10px);
    }

    to {
        transform: translateX(240px);
    }
}
    

    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>37-animations</h1>
            <h4>Animations</h4>
        </header>

        <section>
            <div class="jungle">
                <img src="imgs/logos.png" class="logos">
                <img src="imgs/scream.png" class="scream">
                <div class="move">
                    <img src="imgs/freddy.png" class="freddy">
                </div>
            </div>
        </section>

    </main>
</body>
</html>
