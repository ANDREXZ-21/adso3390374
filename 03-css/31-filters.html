<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filters</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        section div.box {
            border: 2px solid white;
            height: 160px;
            margin: 1rem auto;
            width: 280px;
            overflow: hidden; 
        }

        
        section div.box img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            display: block;
        }

       
        .box1 img {
            filter: blur(2px);
        }

        .box2 img {
            filter: hue-rotate(1000deg);
        }

        .box3 img {
            filter: sepia(50%);
        }

        .box4 img {
            filter: brightness(50%) contrast(1000%);
        }

        .box5 img{
        filter: invert(50%) contrast(100%)
        }

        .box6 img{
            filter: grayscale(20%)  contrast(100%);
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>Filters</h1>
            <h4>Lorem ipsum dolor sit amet</h4>
        </header>

        <section>
            <h4>Filter 1 (Blur)</h4>
            <div class="box box1">
                <img src="imgs/bart.png" alt="bart">
            </div>

            <h4>Filter 2 (hue-rotate)</h4>
            <div class="box box2">
                <img src="imgs/bart.png" alt="bart">
            </div>

            <h4>Filter 3 (Sepia)</h4>
            <div class="box box3">
                <img src="imgs/bart.png" alt="bart">
            </div>

            <h4>Filter 4 (Brightness)</h4>
            <div class="box box4">
                <img src="imgs/bart.png" alt="bart">
            </div>

            <h4>filter 5 (invert)</h4>
            <div class="box box5">
                <img src="imgs/bart.png" alt="bart">
            </div>

            <h4>filter 6 (invert)</h4>
            <div class="box box6">
                <img src="imgs/bart.png" alt="bart">
            </div>
        </section>
    </main>
</body>
</html>
